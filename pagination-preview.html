<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiriTori - ページのプレビュー</title>
  <link rel="stylesheet" href="pagination-preview.css">
</head>
<body>
  <header>
    <div class="brand"><strong>KiriTori</strong><span>ページのプレビュー</span></div>
    <div class="actions"><button id="cancel" type="button">キャンセル</button><button id="save" class="primary" type="button" disabled>保存</button></div>
  </header>
  <main>
    <div class="toolbar">
      <div class="modes" role="group" aria-label="表示方法">
        <button id="single" type="button" aria-pressed="true">１枚ずつ</button>
        <button id="stacked" type="button" aria-pressed="false">縦に並べる</button>
      </div>
      <div id="pager" class="pager">
        <button id="previous" type="button" aria-label="前のページ">←</button>
        <span id="counter" aria-live="polite"></span>
        <button id="next" type="button" aria-label="次のページ">→</button>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite">画像を読み込んでいます…</p>
    <p id="warning" class="warning" role="status" hidden></p>
    <div id="pages" class="pages"></div>
  </main>
  <script src="i18n.js"></script>
  <script src="pagination-preview.js"></script>
</body>
</html>
