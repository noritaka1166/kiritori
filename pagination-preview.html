<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiriTori - ページのプレビュー</title>
  <link rel="icon" href="icons/icon-bird.svg" type="image/svg+xml">
  <link rel="stylesheet" href="pagination-preview.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon-bird.svg" width="32" height="32" alt=""><strong>KiriTori</strong><span>ページのプレビュー</span></div>
    <div class="actions"><button id="cancel" type="button">キャンセル</button><button id="save" class="primary" type="button" disabled>保存</button></div>
  </header>
  <main>
    <div class="toolbar">
      <fieldset class="modes">
        <legend class="visually-hidden">表示方法</legend>
        <button id="single" type="button" aria-pressed="true">１枚ずつ</button>
        <button id="stacked" type="button" aria-pressed="false">縦に並べる</button>
      </fieldset>
      <label class="zoom-control" for="preview-zoom">表示倍率（画面に合わせた幅が基準）
        <select id="preview-zoom">
          <option value="50">50%</option>
          <option value="75">75%</option>
          <option value="100" selected>画面に合わせる（100%）</option>
          <option value="125">125%</option>
          <option value="150">150%</option>
          <option value="200">200%</option>
        </select>
      </label>
      <div id="pager" class="pager">
        <button id="previous" type="button" aria-label="前のページ">←</button>
        <input id="page-number" type="number" min="1" step="1" inputmode="numeric" aria-label="表示するページ番号" disabled>
        <span id="counter" aria-live="polite"></span>
        <button id="next" type="button" aria-label="次のページ">→</button>
      </div>
    </div>
    <output id="status" aria-live="polite">画像を読み込んでいます…</output>
    <output id="warning" class="warning" aria-live="polite" hidden></output>
    <label id="preview-scroll-control" class="preview-scroll-control" hidden>画像を左右に移動
      <input id="preview-scroll" type="range" min="0" max="0" value="0" aria-controls="preview-scroll-area">
    </label>
    <section id="preview-scroll-area" class="pages-scroll" aria-label="プレビュー画像"><div id="pages" class="pages"></div></section>
  </main>
  <script src="i18n.js"></script>
  <script src="pagination-preview.js" type="module"></script>
</body>
</html>
